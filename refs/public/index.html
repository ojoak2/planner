<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Референсы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --fg:#1b1a17; --muted:#6b675f; --line:#dedad1;
  --accent:#d6402b; --accent-fg:#ffffff; --accent-soft:#fbe6e2;
  --pinterest:#e60023; --google:#1a73e8; --yandex:#fc3f1d;
  --display:"Unbounded",system-ui,sans-serif; --body:"Golos Text",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1e1c19; --fg:#efece6; --muted:#a39e94; --line:#34312c;
  --accent:#ff6a52; --accent-fg:#1b0e0b; --accent-soft:#3a1f1a;
  --pinterest:#ff4d6a; --google:#7cacf8; --yandex:#ff7a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1e1c19; --fg:#efece6; --muted:#a39e94; --line:#34312c;
  --accent:#ff6a52; --accent-fg:#1b0e0b; --accent-soft:#3a1f1a;
  --pinterest:#ff4d6a; --google:#7cacf8; --yandex:#ff7a5c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 64px;display:grid;gap:20px}

h1{font:700 clamp(26px,5vw,40px)/1.05 var(--display);margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}

form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.qrow{display:flex;gap:10px;flex-wrap:wrap}
.qrow input{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;font-size:17px}
.go{border:0;background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:12px 22px;font-weight:600;font-size:16px}
.go:disabled{opacity:.6;cursor:progress}
.opts{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.srcs{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;user-select:none;cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.35}
.chip:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.chip:has(input:checked) .dot{opacity:1}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.count{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.count input{width:140px;accent-color:var(--accent)}
.count output{font-weight:600;color:var(--fg);min-width:2ch;font-variant-numeric:tabular-nums}
.recent{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.recent button{border:0;background:var(--bg);border-radius:6px;padding:3px 9px;color:var(--fg)}

.bar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:600}
.stats .err{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}

.grid{columns:4 240px;column-gap:14px}
.card{break-inside:avoid;margin:0 0 14px;position:relative;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.card img{display:block;width:100%;height:auto;min-height:80px;background:var(--line);cursor:zoom-in}
.card .src{position:absolute;top:8px;left:8px;background:var(--c);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
.card .sel{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:8px;border:2px solid #fff;background:rgba(0,0,0,.25);display:grid;place-items:center;color:#fff;font-size:16px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.card.on .sel{background:var(--accent);border-color:var(--accent)}
.card.on{outline:3px solid var(--accent);outline-offset:-3px}
.card .meta{display:flex;gap:6px;align-items:center;padding:8px 10px;font-size:12px;color:var(--muted)}
.card .meta span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta a{color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 7px;flex:none}
.card .meta a:hover{border-color:var(--fg)}

.empty{border:1px dashed var(--line);border-radius:16px;padding:48px 16px;text-align:center;color:var(--muted)}
.loading .ph{break-inside:avoid;margin:0 0 14px;border-radius:12px;background:var(--line);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.45}}
@media (prefers-reduced-motion:reduce){.loading .ph{animation:none}}

.lb{position:fixed;inset:0;background:rgba(10,9,8,.88);display:grid;grid-template-rows:1fr auto;z-index:10;padding:16px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;margin:auto;align-self:center;justify-self:center}
.lb .lbbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:12px}
.lb .btn{background:#2a2825;color:#efece6;border-color:#47433d}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:26px}
.lb .prev{left:12px}.lb .next{right:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Сбор <span>референсов</span></h1>
    <p class="lede">Pinterest, Google Картинки и Яндекс Картинки в одной выдаче. Не больше <b id="maxN">20</b> референсов за запрос.</p>
  </header>

  <form id="f" autocomplete="off">
    <div class="qrow">
      <input id="q" type="search" placeholder="Например: скандинавская кухня, мягкий свет" required maxlength="200" aria-label="Запрос">
      <button class="go" id="go" type="submit">Собрать</button>
    </div>
    <div class="opts">
      <div class="srcs" id="srcs" role="group" aria-label="Источники">
        <label class="chip" style="--c:var(--pinterest)"><input type="checkbox" value="pinterest" checked><span class="dot"></span>Pinterest</label>
        <label class="chip" style="--c:var(--google)"><input type="checkbox" value="google" checked><span class="dot"></span>Google</label>
        <label class="chip" style="--c:var(--yandex)"><input type="checkbox" value="yandex" checked><span class="dot"></span>Яндекс</label>
      </div>
      <label class="count">Сколько <input id="n" type="range" min="1" max="20" value="20"><output id="nOut">20</output></label>
    </div>
    <div class="recent" id="recent" hidden></div>
  </form>

  <section id="results" aria-live="polite">
    <div class="empty">Введите запрос — соберём подборку референсов.</div>
  </section>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Просмотр">
  <img id="lbImg" alt="" referrerpolicy="no-referrer">
  <button class="nav prev" id="lbPrev" aria-label="Предыдущий">‹</button>
  <button class="nav next" id="lbNext" aria-label="Следующий">›</button>
  <div class="lbbar">
    <a class="btn" id="lbPage" target="_blank" rel="noopener">Источник</a>
    <a class="btn" id="lbOrig" target="_blank" rel="noopener">Оригинал</a>
    <a class="btn" id="lbDl">Скачать</a>
    <button class="btn" id="lbClose">Закрыть</button>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const LABEL = { pinterest: 'Pinterest', google: 'Google', yandex: 'Яндекс' };
const state = { query: '', items: [], selected: new Set(), idx: -1 };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const proxied = (u, dl) => `/api/image?url=${encodeURIComponent(u)}` + (dl ? `&download=${encodeURIComponent(dl)}` : '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}

// --- settings memory
const n = $('#n');
n.addEventListener('input', () => { $('#nOut').value = n.value; store.set('refs.n', n.value); });
n.value = store.get('refs.n', 20); $('#nOut').value = n.value;
const savedSrc = store.get('refs.src', null);
document.querySelectorAll('#srcs input').forEach((cb) => {
  if (savedSrc) cb.checked = savedSrc.includes(cb.value);
  cb.addEventListener('change', () => store.set('refs.src', chosenSources()));
});
const chosenSources = () => [...document.querySelectorAll('#srcs input:checked')].map((c) => c.value);

fetch('/api/config').then((r) => r.json()).then((c) => {
  $('#maxN').textContent = c.max; n.max = c.max;
}).catch(() => {});

function renderRecent() {
  const list = store.get('refs.recent', []);
  const el = $('#recent');
  el.hidden = !list.length;
  el.innerHTML = list.length ? 'Недавние: ' + list.map((q) => `<button type="button">${esc(q)}</button>`).join('') : '';
  el.querySelectorAll('button').forEach((b) => b.onclick = () => { $('#q').value = b.textContent; run(); });
}
renderRecent();

// --- search
$('#f').addEventListener('submit', (e) => { e.preventDefault(); run(); });

async function run() {
  const q = $('#q').value.trim();
  const sources = chosenSources();
  if (!q) return;
  if (!sources.length) return toast('Выберите хотя бы один источник');
  const recent = [q, ...store.get('refs.recent', []).filter((x) => x !== q)].slice(0, 8);
  store.set('refs.recent', recent); renderRecent();

  $('#go').disabled = true; $('#go').textContent = 'Ищем…';
  $('#results').innerHTML = `<div class="grid loading">${Array.from({ length: Math.min(+n.value, 12) }, (_, i) =>
    `<div class="ph" style="height:${160 + ((i * 73) % 160)}px"></div>`).join('')}</div>`;
  try {
    const params = new URLSearchParams({ q, sources: sources.join(','), limit: n.value });
    const r = await fetch('/api/search?' + params);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Ошибка');
    state.query = q; state.items = data.items; state.selected = new Set();
    render(data);
  } catch (e) {
    $('#results').innerHTML = `<div class="empty">Не получилось: ${esc(e.message)}</div>`;
  } finally {
    $('#go').disabled = false; $('#go').textContent = 'Собрать';
  }
}

function render(data) {
  const stats = Object.entries(data.stats).map(([id, s]) =>
    `<span>${esc(LABEL[id])}: <b>${s.used}</b>${s.error ? ` <span class="err" title="${esc(s.error)}">— ${esc(s.error)}</span>` : ''}${s.warning ? ` <span title="${esc(s.warning)}">(${esc(s.warning)})</span>` : ''}</span>`).join('');
  const head = `<div class="bar">
    <div class="stats"><span>Найдено <b>${data.items.length}</b> из ${data.limit}</span>${stats}</div>
    <div class="actions"${data.items.length ? '' : ' hidden'}>
      <button class="btn" id="selAll" type="button">Выбрать все</button>
      <button class="btn" id="copy" type="button">Копировать ссылки</button>
      <button class="btn" id="zip" type="button">Скачать ZIP</button>
    </div></div>`;
  if (!data.items.length) {
    $('#results').innerHTML = head + '<div class="empty">Ничего не нашлось. Попробуйте другой запрос или источники.</div>';
  } else {
    $('#results').innerHTML = head + '<div class="grid" id="grid" style="margin-top:14px">' + data.items.map((it, i) => `
      <figure class="card" data-i="${i}" style="--c:var(--${it.source})">
        <img src="${esc(it.thumb || it.url)}" alt="${esc(it.title)}" loading="lazy" referrerpolicy="no-referrer"
             ${it.width && it.height ? `width="${it.width}" height="${it.height}"` : ''}>
        <span class="src">${esc(LABEL[it.source])}</span>
        <button class="sel" type="button" aria-label="Выбрать" aria-pressed="false">✓</button>
        <figcaption class="meta"><span title="${esc(it.title)}">${esc(it.title || hostOf(it.page || it.url))}</span>
          ${it.page ? `<a href="${esc(it.page)}" target="_blank" rel="noopener">Источник</a>` : ''}
          <a href="${proxied(it.url, `${state.query} ${i + 1}`)}" download>Скачать</a></figcaption>
      </figure>`).join('') + '</div>';
    wireGrid();
  }
  $('#selAll').onclick = () => {
    const all = state.selected.size !== state.items.length;
    state.selected = new Set(all ? state.items.map((_, i) => i) : []);
    syncSel();
  };
  $('#copy').onclick = async () => {
    const list = pick().map((it) => it.url).join('\n');
    try { await navigator.clipboard.writeText(list); toast('Ссылки скопированы'); }
    catch { toast('Не удалось скопировать'); }
  };
  $('#zip').onclick = downloadZip;
  syncSel();
}

const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const pick = () => state.selected.size ? state.items.filter((_, i) => state.selected.has(i)) : state.items;

function wireGrid() {
  document.querySelectorAll('.card').forEach((card) => {
    const i = +card.dataset.i;
    const img = card.querySelector('img');
    img.onerror = () => {
      // retry through the local proxy (hotlink protection), then drop the card
      if (!img.dataset.retry) { img.dataset.retry = 1; img.src = proxied(state.items[i].thumb || state.items[i].url); }
      else card.style.display = 'none';
    };
    img.onclick = () => openLb(i);
    card.querySelector('.sel').onclick = () => {
      state.selected.has(i) ? state.selected.delete(i) : state.selected.add(i);
      syncSel();
    };
  });
}

function syncSel() {
  document.querySelectorAll('.card').forEach((c) => {
    const on = state.selected.has(+c.dataset.i);
    c.classList.toggle('on', on);
    c.querySelector('.sel').setAttribute('aria-pressed', on);
  });
  const k = state.selected.size;
  if ($('#zip')) $('#zip').textContent = k ? `Скачать ZIP (${k})` : 'Скачать ZIP';
  if ($('#copy')) $('#copy').textContent = k ? `Копировать ссылки (${k})` : 'Копировать ссылки';
  if ($('#selAll')) $('#selAll').textContent = k === state.items.length && k ? 'Снять выбор' : 'Выбрать все';
}

async function downloadZip() {
  const btn = $('#zip'); const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Собираем архив…';
  try {
    const r = await fetch('/api/zip', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: state.query, items: pick() }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const blob = await r.blob();
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `${state.query}.zip` });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { toast('Архив не собрался: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}

// --- lightbox
const lb = $('#lb'), lbImg = $('#lbImg');
function openLb(i) {
  state.idx = (i + state.items.length) % state.items.length;
  const it = state.items[state.idx];
  lbImg.dataset.stage = '';
  lbImg.src = it.url;
  lbImg.onerror = () => {
    const st = lbImg.dataset.stage;
    if (!st) { lbImg.dataset.stage = 'proxy'; lbImg.src = proxied(it.url); }
    else if (st === 'proxy') { lbImg.dataset.stage = 'thumb'; lbImg.src = it.thumb; }
  };
  $('#lbPage').hidden = !it.page; $('#lbPage').href = it.page || '#';
  $('#lbOrig').href = it.url;
  $('#lbDl').href = proxied(it.url, `${state.query} ${state.idx + 1}`);
  lb.hidden = false; $('#lbClose').focus();
}
const closeLb = () => { lb.hidden = true; lbImg.removeAttribute('src'); };
$('#lbClose').onclick = closeLb;
$('#lbPrev').onclick = () => openLb(state.idx - 1);
$('#lbNext').onclick = () => openLb(state.idx + 1);
lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', (e) => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') openLb(state.idx - 1);
  if (e.key === 'ArrowRight') openLb(state.idx + 1);
});
</script>
</body>
</html>
